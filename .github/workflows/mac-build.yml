# Unsigned (ad-hoc) macOS build for trying Lumen on an Apple-silicon Mac without compiling locally.
# Run it from the Actions tab (Mac build ▸ Run workflow); the DMG is in the run's artifacts.
# The real, signed and notarized build is release.yml.
name: Mac build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    name: macOS Apple silicon (ad-hoc signed)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0 # same pin as release.yml
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: mac-build-aarch64
      - name: Build the AI mask models
        shell: bash
        run: tools/build-salient-models.sh "$RUNNER_TEMP/models"
      - name: Build and package
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          LIGHTCRAFT_MODELS_DIR: ${{ runner.temp }}/models
          LIGHTCRAFT_MODELS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lightcraft-macos
          path: dist/release/*
          if-no-files-found: error
